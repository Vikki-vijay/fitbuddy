<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Fitness Planner</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>

    <div class="container nav">

        <h1>💪 FitBuddy</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/view-all-users">Users</a>
            <a href="/health">Health</a>
        </nav>

    </div>

</header>


<main class="container">

    <section class="hero">

        <h2>AI Fitness Plan Generator</h2>

        <p>
            Generate a personalized 7-day fitness plan using AI.
        </p>

    </section>


    <section class="card">

        <h2>Enter Your Fitness Details</h2>

        <form action="/generate-workout" method="post">

            <div class="grid">

                <div class="form-group">

                    <label>User ID</label>

                    <input
                        type="text"
                        name="user_id"
                        placeholder="user001"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        min="13"
                        max="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Weight (kg)</label>

                    <input
                        type="number"
                        name="weight"
                        min="20"
                        max="400"
                        step="0.1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Fitness Goal</label>

                    <select name="goal">

                        <option value="weight loss">
                            Weight Loss
                        </option>

                        <option value="muscle gain">
                            Muscle Gain
                        </option>

                        <option value="general wellness">
                            General Wellness
                        </option>

                        <option value="flexibility">
                            Flexibility
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Intensity</label>

                    <select name="intensity">

                        <option value="low">
                            Low
                        </option>

                        <option value="medium" selected>
                            Medium
                        </option>

                        <option value="high">
                            High
                        </option>

                    </select>

                </div>

            </div>


            <button type="submit">
                ✨ Generate Workout Plan
            </button>

        </form>

    </section>

</main>

</body>
</html>
